known_gaps:
  - id: GAP-001
    journey: CJ-001
    priority: P0
    description: >
      src/fetch.py is partially tested. robots enforcement IS covered
      (CONDUCT-005/006) and the disk cache IS now covered including the
      sticky-mitigation carve-out (CONDUCT-009, added 2026-09-05 with ADR-011).
      The rate limiter (_throttle) and the live mitigation call path on a real
      response remain unverified.
    resolution: >
      src/fetch.py is now covered end to end: robots (CONDUCT-005/006), the disk cache and its sticky-mitigation carve-out (CONDUCT-009), the rate limiter (CONDUCT-010) and the mitigation call path (CONDUCT-011).
    status: closed
    closed: 2026-09-06
    first_seen: 2026-09-03
    owner: mudit

  - id: GAP-002
    journey: CJ-002
    priority: P0
    description: >
      assertions.check_mitigation is tested, but nothing verifies Fetcher.get
      actually calls it. The guard could be removed from the call path and the
      suite would stay green.
    resolution: >
      Closed 2026-09-06 by CONDUCT-011: get() is asserted to raise on 403/429/503 and on cf-mitigated, and to log the cf-ray before raising.
    status: closed
    closed: 2026-09-06
    first_seen: 2026-09-03
    owner: mudit

  - id: GAP-003
    journey: CJ-004
    priority: P0
    description: >
      src/config.py untested. The delay_range floor guard - a conduct control -
      has never been exercised.
    resolution: >
      Closed 2026-09-06 by CONDUCT-010: the delay_range floor guard is exercised, including that a CLI override cannot smuggle a faster floor past it.
    status: closed
    closed: 2026-09-06
    first_seen: 2026-09-03
    owner: mudit

  - id: GAP-004
    journey: CJ-006
    priority: P0
    description: >
      src/crawl.py untested. PageWrap is verified as an assertion but not as
      slice-loop behaviour: nothing proves crawl_slice catches it, stops, and
      records ended_reason instead of propagating.
    status: open
    first_seen: 2026-09-03
    owner: mudit

  - id: GAP-005
    journey: CJ-011
    priority: P1
    description: >
      Resume path untested. A resume telemetry bug (skipped pages inflating
      pages_walked without jobs_seen) already shipped once and was caught by
      eye, not by a test.
    status: open
    first_seen: 2026-09-03
    owner: mudit

  - id: GAP-006
    journey: CJ-016
    priority: P1
    description: Cache read/write round-trip untested; no proof re-runs avoid the network.
    resolution: >
      Closed 2026-09-06 by CONDUCT-009: cache read/write round-trip, freshness window, and proof a re-run inside the window makes no request.
    status: closed
    closed: 2026-09-06
    first_seen: 2026-09-03
    owner: mudit

  - id: GAP-007
    journey: CJ-001
    priority: P1
    description: >
      "All egress goes through Fetcher.get" is convention only. No test or lint
      prevents a second httpx call bypassing robots and the rate limit.
      Automatable as an AST or grep check.
    resolution: >
      Closed 2026-09-06 by CONDUCT-012: a static AST check fails if any module outside src/fetch.py imports a transport. urllib.parse is deliberately allowed; the check is proven able to detect a real offender.
    status: closed
    closed: 2026-09-06
    first_seen: 2026-09-03
    owner: mudit

  - id: GAP-008
    journey: CJ-015
    priority: P1
    description: >
      enrich_ids orchestration untested (only parse_detail is). The 409 lock
      that prevents concurrent rate-limit breach is unverified.
    status: open
    first_seen: 2026-09-03
    owner: mudit

  - id: GAP-009
    journey: CJ-017
    priority: P1
    description: >
      apply_url shape verified manually against a live posting on 2026-09-03,
      never automated. Cannot be fully automated without network; a unit test
      pinning the URL template against a known raw node is the affordable half.
    status: open
    first_seen: 2026-09-03
    owner: mudit

  - id: GAP-016
    priority: P2
    journey: CJ-035
    description: >
      Jobs ingested before ADR-009 carry provenance 'all', 'dev' or 'engineer'
      and were never role-filtered, so the RemoteOK slice of the corpus still
      contains Kitchen Technician and JANITOR. Visible in the found-via-role
      facet; needs a deliberate prune or a re-fetch, not an automatic delete.
    resolution: >
      Closed 2026-09-06: `cli reconcile --apply` re-tagged 149 rows with a real role and removed 512 off-role rows. JANITOR/Kitchen Technician/Carpenter/Data Entry Clerk are gone from the corpus.
    status: closed
    closed: 2026-09-06
    first_seen: 2026-09-04
    owner: mudit

  - id: GAP-017
    priority: P3
    journey: CJ-035
    description: >
      HTML entities in source titles are double-escaped in the UI
      ("H&amp;M Visual Merchandiser"), and some RemoteOK titles show mojibake.
      Cosmetic; needs unescaping at the view or render layer.
    resolution: >
      Closed 2026-09-06 as a side effect of GAP-016: both affected rows were RemoteOK junk removed by the reconcile. Verified 0 rows remain with double-escaped entities.
    status: closed
    closed: 2026-09-06
    first_seen: 2026-09-04
    owner: mudit

  - id: GAP-014
    priority: P1
    journey: CJ-032
    description: >
      Cross-currency salary comparison is wrong. salary_min mixes USD, INR, EUR,
      CAD, PLN and BRL in one column, so sorting by salary compares 1500000 INR
      against 150000 USD. Pre-dates multi-source (Wellfound already mixed the
      two) but is now visible. Needs a normalised salary_usd, or a currency
      filter, before salary sort can be trusted.
    resolution: >
      Closed 2026-09-06 by ADR-012: salary_currency is derived from the symbol and salary_usd_* added for ordering; sort and threshold filter both use it. 2,331 rows gained a currency.
    status: closed
    closed: 2026-09-06
    first_seen: 2026-09-04
    owner: mudit

  - id: GAP-015
    priority: P2
    journey: CJ-030
    description: >
      found_via_roles mixes vocabularies: Wellfound role slugs, RemoteOK tags,
      and the literal 'all'. Honest but confusing in the facet. Consider a
      separate provenance kind column.
    status: open
    first_seen: 2026-09-04
    owner: mudit

  - id: GAP-013
    journey: CJ-026
    priority: P1
    description: >
      store.migrate() is untested. It was written after a real failure -- an
      existing database broke with "no such column: stale_skipped" because
      CREATE TABLE IF NOT EXISTS does not alter an existing table. A test would
      create a pre-migration schema and assert the column arrives.
      Narrowed 2026-09-06 by STORE-015: the ORDERING is now covered (a database
      that is view-current but migration-pending still migrates, which is what
      the drop-views-before-migrate rule protects). The migrations' own
      CONTENT -- each ADD_COLUMNS entry and the v1->v2 rewrite -- remains
      untested, so this stays open.
    status: open
    first_seen: 2026-09-04
    owner: mudit

  - id: GAP-012
    journey: CJ-022
    priority: P0
    description: >
      The web crawl endpoint's guards (unknown-slug rejection, 409 on a
      concurrent run, and the background CrawlJob lock) were verified by hand
      against a running server on 2026-09-04 but have no automated test. The
      concurrency guard is a conduct control.
    status: open
    first_seen: 2026-09-04
    owner: mudit

  - id: GAP-011
    journey: CJ-003
    priority: P0
    description: >
      The rate limiter itself is unverified. Fetcher._throttle has no test, so
      a regression that drops the spacing to zero would ship silently and look
      to Wellfound like an attack. This is the conduct control with the largest
      blast radius and the least protection.
    resolution: >
      Closed 2026-09-06 by CONDUCT-010: spacing is asserted across consecutive requests, drawn from the configured range, and skipped on a cache hit.
    status: closed
    closed: 2026-09-06
    first_seen: 2026-09-03
    owner: mudit

  - id: GAP-010
    journey: CJ-010
    priority: P1
    description: >
      No CI. The suite passes locally and nothing enforces it. Maturity level 1:
      tests exist, nothing blocks.
    resolution: >
      Closed 2026-09-06: .github/workflows/ci.yml runs the suite on 3.11 and 3.14, both validators, and the suite again with outbound traffic blocked. Daily schedule included because a dated fixture broke six tests overnight with no commit to blame.
    status: closed
    closed: 2026-09-06
    first_seen: 2026-09-03
    owner: mudit

