schema_version: "1.0"

product:
  name: jobsearch
  owners: [mudit]

# ---------------------------------------------------------------------------
# Capabilities. Priority is cost of failure, not implementation complexity.
# Note that CAP-CONDUCT outranks everything: it is the only capability whose
# failure harms a third party and can revoke our access permanently.
# ---------------------------------------------------------------------------
capabilities:
  - id: CAP-CONDUCT
    name: Polite-crawl conduct
    priority: P0
    description: >
      robots.txt enforcement, 3-5s rate limit, concurrency 1, honest UA, and
      halting on the first Cloudflare mitigation. Failure gets the user blocked
      and breaks every other capability irrecoverably.

  - id: CAP-INTEGRITY
    name: Corpus integrity guards
    priority: P0
    description: >
      SilentRoleFallback, PageWrap, YieldFloor, SchemaDrift. Each guards a
      failure that returns HTTP 200 with plausible data.

  - id: CAP-STATE
    name: User workflow state
    priority: P0
    description: >
      shortlist / applied / hidden. The ONLY non-regenerable data in the
      database - everything else can be re-crawled. Loss is silent and
      unrecoverable.

  - id: CAP-CRAWL
    name: Slice crawl and dedupe
    priority: P0
    description: Page walking, termination, dedupe on source_job_id, provenance.

  - id: CAP-STORE
    name: Raw storage and derived view
    priority: P0
    description: Raw Apollo persistence plus the jobs view and its derivations.

  - id: CAP-CONFIG
    name: Configuration and guards
    priority: P0
    description: >
      targets.yaml loading, CLI overrides, and the delay_range floor guard,
      which is a conduct control living in config.

  - id: CAP-ENRICH
    name: On-demand detail enrichment
    priority: P1
    description: Detail pages for equity and improved salary.

  - id: CAP-FILTER
    name: Filter, sort, and apply links
    priority: P1
    description: SQL-side filtering, sorting, pagination, working apply URLs.

# ---------------------------------------------------------------------------
# Journeys. System-facing ones are listed explicitly because nobody clicks
# them and they are where this repo will actually break.
# ---------------------------------------------------------------------------
journeys:
  - id: CJ-001
    name: robots.txt-disallowed URL is refused before any request
    capability: CAP-CONDUCT
    priority: P0
    facing: system
    blast_radius: Crawls a forbidden path; breaks our stated conduct; silent
    release_blocking: true

  - id: CJ-002
    name: Cloudflare mitigation halts the crawl and commits progress
    capability: CAP-CONDUCT
    priority: P0
    facing: system
    blast_radius: Retrying through a block escalates to a hard ban
    release_blocking: true

  - id: CJ-003
    name: Rate limit holds at >=3s between requests, concurrency 1
    capability: CAP-CONDUCT
    priority: P0
    facing: system
    blast_radius: Looks like an attack; triggers mitigation
    release_blocking: true

  - id: CJ-004
    name: delay_range below 3.0s is rejected at config load
    capability: CAP-CONFIG
    priority: P0
    facing: system
    blast_radius: Silently removes the only enforced conduct guard
    release_blocking: true

  - id: CJ-005
    name: Invalid role slug is refused, never ingested
    capability: CAP-INTEGRITY
    priority: P0
    facing: system
    blast_radius: Corpus silently filled with unfiltered location-wide results
    release_blocking: true

  - id: CJ-006
    name: Pagination wrap ends the slice without duplicating page 1
    capability: CAP-INTEGRITY
    priority: P0
    facing: system
    blast_radius: Corpus inflated with repeated page-1 rows; silent
    release_blocking: true

  - id: CJ-007
    name: App Router migration fails loudly with a diagnosis
    capability: CAP-INTEGRITY
    priority: P0
    facing: system
    blast_radius: Parser silently yields zero jobs; looks like an empty result
    release_blocking: true

  - id: CJ-008
    name: Broken parse yielding 0 jobs is distinguished from a real empty page
    capability: CAP-INTEGRITY
    priority: P0
    facing: system
    blast_radius: Crawl reports success having stored nothing
    release_blocking: true

  - id: CJ-009
    name: Same job found via multiple slices is one row with N provenance rows
    capability: CAP-CRAWL
    priority: P0
    facing: system
    blast_radius: Duplicate rows; found_via_roles filter wrong
    release_blocking: true

  - id: CJ-010
    name: Re-crawl rewrites job_raw and user_state survives
    capability: CAP-STATE
    priority: P0
    facing: user
    blast_radius: User loses every applied/shortlisted mark. Unrecoverable
    release_blocking: true

  - id: CJ-011
    name: Interrupted crawl resumes without re-requesting completed pages
    capability: CAP-CRAWL
    priority: P1
    facing: system
    blast_radius: Wasted rate-limited requests; corrupted slice telemetry
    release_blocking: false

  - id: CJ-012
    name: Absent values ('' not null) normalise so filters and fill rates are honest
    capability: CAP-STORE
    priority: P1
    facing: user
    blast_radius: Every has-salary filter wrong; fill rate reads 100% at 52% true
    release_blocking: false

  - id: CJ-013
    name: Salary and equity parse across USD and INR formats, or yield NULL
    capability: CAP-STORE
    priority: P1
    facing: user
    blast_radius: Wrong numeric filtering on money; silently wrong
    release_blocking: false

  - id: CJ-014
    name: Filter set produces correct, injection-safe SQL
    capability: CAP-FILTER
    priority: P1
    facing: user
    blast_radius: Wrong result set, or arbitrary SQL execution
    release_blocking: false

  - id: CJ-015
    name: Enrich a filtered set recovers equity without exceeding the rate limit
    capability: CAP-ENRICH
    priority: P1
    facing: user
    blast_radius: Concurrent enrich runs breach the rate limit
    release_blocking: false

  - id: CJ-016
    name: Re-run replays from disk cache instead of the network
    capability: CAP-CONDUCT
    priority: P1
    facing: system
    blast_radius: Repeated development runs multiply live traffic
    release_blocking: false

  - id: CJ-018
    name: Location filter targets real places, not crawl slice tokens
    capability: CAP-FILTER
    priority: P1
    facing: user
    blast_radius: >
      User cannot filter by where the job actually is. Shipped as a real bug:
      the UI offered 3 slice tokens while the data held 700+ places.
    release_blocking: false

  - id: CJ-019
    name: Facets recompute per dimension so selections narrow each other
    capability: CAP-FILTER
    priority: P1
    facing: user
    blast_radius: >
      Selecting a value erases its own siblings from the list, or facet counts
      stop matching the result set. Silently misleading.
    release_blocking: false

  - id: CJ-020
    name: Each of the three role URL shapes resolves correctly
    capability: CAP-CRAWL
    priority: P0
    facing: system
    blast_radius: >
      Wrong shape means the wrong page type and possibly no role filter at all
      -- an unfiltered corpus, HTTP 200, no error.
    release_blocking: true

  - id: CJ-021
    name: job_location re-derives from stored raw JSON without a re-crawl
    capability: CAP-STORE
    priority: P1
    facing: system
    blast_radius: Stale or missing location facet; worst case a needless re-crawl
    release_blocking: false

  - id: CJ-022
    name: UI-triggered crawl refuses unknown slugs and concurrent runs
    capability: CAP-CONDUCT
    priority: P0
    facing: user
    blast_radius: >
      Concurrent crawls breach the 1-request-at-a-time rate limit; arbitrary
      slugs would crawl unvalidated paths.
    release_blocking: true

  - id: CJ-053
    name: A running fetch is distinguishable from a hung one
    capability: CAP-FILTER
    priority: P1
    facing: user
    blast_radius: >
      A cold all-sources fetch is ~180 minutes and the only signal it was alive
      was a disabled button. _expand_ats skipped the on_event for a company that
      failed to resolve, but resolve() probes up to six token candidates at 3-5s
      each -- so the expensive half of the run reported nothing and a working
      crawl was indistinguishable from a deadlock. Without a heartbeat the user
      either kills a healthy run or waits hours on a dead one.
    release_blocking: false

  - id: CJ-054
    name: The hosted app serves read-only and never exposes a crawl trigger
    capability: CAP-CONDUCT
    priority: P0
    facing: user
    blast_radius: >
      The hosted UI is a public URL. /api/crawl, /api/fetch, /api/ingest and
      /api/enrich were written for localhost and have no authentication -- left
      registered they are an internet-reachable trigger for crawling third-party
      sites from the user's identity, with concurrency 1 broken by whoever else
      calls them. They must be absent, not merely refusing.
    release_blocking: true

  - id: CJ-055
    name: A corpus refresh keeps local marks; the published copy carries none
    capability: CAP-FILTER
    priority: P1
    facing: user
    blast_radius: >
      Two failures, opposite directions. Adopting a freshly downloaded corpus
      REPLACES the local file, so without a merge every applied and shortlisted
      mark is silently destroyed -- the same invariant prune_stale protects.
      And publishing jobs.db directly would push those marks to a public URL;
      the published copy must be third-party listings and nothing personal.
    release_blocking: false

  - id: CJ-056
    name: The published corpus is pruned and compacted without losing marked jobs
    capability: CAP-STORE
    priority: P1
    facing: user
    blast_radius: >
      The corpus grows daily against a 250 MB serverless bundle limit, so the
      workflow prunes past the age cutoff. Two ways that goes wrong. SQLite does
      not return deleted pages to the OS, so a prune without VACUUM reclaims
      nothing and the limit is hit anyway -- measured, 59.7 MB before and after
      deleting 1,883 of 6,266 jobs. And the published corpus carries no marks, so
      its prune cannot spare a job the user applied to; adopting it would delete
      that listing and leave the user_state row pointing at nothing.
    release_blocking: false

  - id: CJ-023
    name: Age cutoff drops stale jobs at ingest, keeps unknown-age jobs
    capability: CAP-STORE
    priority: P1
    facing: system
    blast_radius: Corpus fills with dead listings, or fresh jobs wrongly dropped
    release_blocking: false

  - id: CJ-024
    name: An all-stale page does NOT end the slice
    capability: CAP-INTEGRITY
    priority: P0
    facing: system
    blast_radius: >
      Wellfound does not order results by date. Stopping on a stale page
      silently discards fresh jobs deeper in the results -- HTTP 200, no error,
      a quietly incomplete corpus.
    release_blocking: true

  - id: CJ-025
    name: prune is dry-run by default and never deletes user_state
    capability: CAP-STATE
    priority: P0
    facing: user
    blast_radius: >
      Irreversible loss of the corpus, or of applied/shortlisted marks that
      cannot be regenerated by any crawl.
    release_blocking: true

  - id: CJ-026
    name: An added column reaches a database created before it existed
    capability: CAP-STORE
    priority: P1
    facing: system
    blast_radius: >
      CREATE TABLE IF NOT EXISTS does not alter an existing table; the app runs
      until the first query names the column, then fails on the user's data.
    release_blocking: false

  - id: CJ-027
    name: robots.txt rules are per origin and never leak between hosts
    capability: CAP-CONDUCT
    priority: P0
    facing: system
    blast_radius: >
      One host's robots.txt governing another lets us fetch a path that site
      forbids. Silent, external-facing, and the precondition for any
      multi-source work.
    release_blocking: true

  - id: CJ-028
    name: A host whose robots.txt cannot be read is never crawled
    capability: CAP-CONDUCT
    priority: P0
    facing: system
    blast_radius: >
      Crawling blind. naukri.com serves 403 on its own robots.txt; defaulting
      to permissive would crawl a site that never granted permission.
    release_blocking: true

  - id: CJ-029
    name: Core views match CORE_COLUMNS positionally
    capability: CAP-STORE
    priority: P0
    facing: system
    blast_radius: >
      UNION ALL aligns by position. A drifted source view still builds and
      silently serves another column's values -- salary shown as a timestamp,
      and no error anywhere.
    release_blocking: true

  - id: CJ-030
    name: Ids and company slugs do not collide across sources
    capability: CAP-STORE
    priority: P0
    facing: system
    blast_radius: >
      RemoteOK id 1137286 and a Wellfound 1137286 would be one row, each
      overwriting the other on every run. Silent data loss.
    release_blocking: true

  - id: CJ-031
    name: A pre-multi-source database migrates without losing rows or user_state
    capability: CAP-STATE
    priority: P0
    facing: user
    blast_radius: >
      Losing the corpus, or losing applied/shortlisted marks that no crawl can
      regenerate.
    release_blocking: true

  - id: CJ-032
    name: Non-annual salary is never emitted as a comparable number
    capability: CAP-STORE
    priority: P1
    facing: user
    blast_radius: >
      An hourly 70 sorts beside an annual 70000. Silently wrong ordering on the
      field people sort by most.
    release_blocking: false

  - id: CJ-033
    name: expired reflects the real expiry date, and NULL means unknown
    capability: CAP-FILTER
    priority: P1
    facing: user
    blast_radius: >
      Shipped once: SQLite type ordering made every job with an expiry read as
      expired, hiding the entire Himalayas corpus behind the default filter.
    release_blocking: false

  - id: CJ-034
    name: Each JSON source raises on a payload shape change
    capability: CAP-INTEGRITY
    priority: P0
    facing: system
    blast_radius: >
      A renamed field yields zero jobs and an apparently successful run. These
      APIs have no stability contract.
    release_blocking: true

  - id: CJ-035
    name: Role fetch reports how each source actually filtered
    capability: CAP-FILTER
    priority: P0
    facing: user
    blast_radius: >
      "Fetched 40 jobs for role X" read as server-side filtering when only
      Wellfound does it. The user trusts a corpus that was never filtered the
      way they think.
    release_blocking: true

  - id: CJ-036
    name: Local role matching uses word boundaries and ignores unreliable tags
    capability: CAP-STORE
    priority: P1
    facing: user
    blast_radius: >
      Substring matching puts HTML jobs under "ml" and retail under "ai";
      matching RemoteOK's own tags puts carpenters under software-engineer.
      Both observed during development.
    release_blocking: false

  - id: CJ-037
    name: RemoteOK role fetch uses the live feed, never the archive tag endpoints
    capability: CAP-CRAWL
    priority: P1
    facing: system
    blast_radius: >
      Tag endpoints have median age 112-144 days versus 5 for the live feed, so
      with the 30-day cutoff a tag-based fetch silently returns nothing.
    release_blocking: false

  - id: CJ-038
    name: An empty filtered result is not treated as a schema change
    capability: CAP-INTEGRITY
    priority: P1
    facing: system
    blast_radius: >
      Shipped bug: a tag matching nothing returns only the legal-notice element,
      which raised SchemaDrift and aborted an otherwise healthy ingest.
    release_blocking: false

  - id: CJ-039
    name: ATS board expansion is bounded by the corpus, not the provider
    capability: CAP-CONDUCT
    priority: P0
    facing: system
    blast_radius: >
      Walking all 2,002 companies across four providers is thousands of
      rate-limited requests against third parties for no added value.
    release_blocking: true

  - id: CJ-040
    name: Board-token resolution caches hits AND misses
    capability: CAP-CONDUCT
    priority: P1
    facing: system
    blast_radius: >
      Re-probing six token candidates per unresolvable company on every run
      multiplies traffic against a third party.
    release_blocking: false

  - id: CJ-041
    name: Greenhouse fields map correctly, and absent ones stay NULL
    capability: CAP-STORE
    priority: P1
    facing: user
    blast_radius: >
      Entity-encoded HTML shown raw; guessed salary or remote flags that the
      source never provided.
    release_blocking: false

  - id: CJ-042
    name: Ashby expands only robots-allowed hosted boards and maps posting details
    capability: CAP-STORE
    priority: P1
    facing: user
    blast_radius: >
      A silent-200 invalid board can be mistaken for a resolved company; salary
      periods, remote type, or posting age can be mapped incorrectly.
    release_blocking: false

  - id: CJ-043
    name: A stale listing is re-fetched; a cached mitigation never is
    capability: CAP-CONDUCT
    priority: P0
    facing: system
    blast_radius: >
      Without the TTL the tool is live exactly once per URL and silently stops
      discovering new jobs. With a TTL that ignores the mitigation carve-out it
      becomes a backoff-and-continue path, retrying a 403 on a six-hour timer.
    release_blocking: true

  - id: CJ-044
    name: Workable collapses per-location entries and dates bare dates correctly
    capability: CAP-STORE
    priority: P1
    facing: user
    blast_radius: >
      Uncollapsed, telemetry inflates several-fold and all but one location is
      discarded. A bare date read as local midnight drops postings up to 24 h
      early, and disagreeing with the view hides a stored job with no explanation.
    release_blocking: false

  - id: CJ-045
    name: A colliding ATS board token is rejected by account name
    capability: CAP-STORE
    priority: P1
    facing: user
    blast_radius: >
      resolve() binds the first token that answers 200, so another company's
      entire board can be silently attached to ours.
    release_blocking: false



  - id: CJ-048
    name: No module outside src/fetch.py imports a network transport
    capability: CAP-CONDUCT
    priority: P0
    facing: system
    blast_radius: >
      A second egress path bypasses robots, the rate limit and the mitigation
      halt in one step - every conduct rule at once.
    release_blocking: true

  - id: CJ-049
    name: Salary sorts and filters on a currency-normalised value
    capability: CAP-FILTER
    priority: P1
    facing: user
    blast_radius: >
      Sorting on the native figure ranked every INR salary above every USD one
      on the UI's primary sort control, and a threshold filter matched the
      wrong side of the corpus.
    release_blocking: false

  - id: CJ-050
    name: Retroactive role filter drops off-role rows without touching filtered ones
    capability: CAP-STORE
    priority: P1
    facing: user
    blast_radius: >
      Too broad and it deletes server-side-filtered Wellfound rows under a
      retired slug; matched on RemoteOK's own tags and it keeps a janitor as a
      software engineer. Both were hit while building it.
    release_blocking: false

  - id: CJ-051
    name: Lever adapts its array payload and millisecond timestamps
    capability: CAP-STORE
    priority: P1
    facing: user
    blast_radius: >
      Lever's wire format is a bare array where every other source returns an
      object with `jobs`; returning it raw makes ats.resolve die with
      AttributeError and takes the whole run down. Its createdAt is epoch
      MILLISECONDS - read as seconds every posting is permanently fresh. Its
      404 body is valid JSON, so a JSON-only check reads an error as a board.
    release_blocking: false

  - id: CJ-052
    name: connect() is safe to call concurrently and repeatedly
    capability: CAP-STORE
    priority: P0
    facing: user
    blast_radius: >
      Views belong to the database file, not the connection. connect() dropped
      and recreated both on every call, and the web app opens a connection per
      request across FastAPI's threadpool while the UI fires /api/jobs and
      /api/facets in parallel -- so page load 500'd with "view jobs_core
      already exists" (16 of 20 concurrent /api/facets, measured). The quiet
      half is worse: one connection could DROP `jobs` while another was
      mid-query against it.
    release_blocking: true

  - id: CJ-017
    name: apply_url resolves to the correct live Wellfound posting
    capability: CAP-FILTER
    priority: P1
    facing: user
    blast_radius: User cannot apply; the entire point of the tool
    release_blocking: false

