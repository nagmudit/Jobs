[project]
name = "wellfound-probe"
version = "0.1.0"
description = "Feasibility probe: which data-acquisition path for Wellfound job listings is viable and durable?"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]

[tool.setuptools.packages.find]
include = ["src*"]
