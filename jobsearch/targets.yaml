# Everything the crawler targets lives here. Nothing is hardcoded in the source.
# The UI crawls a subset of these on demand; this file is the menu, not a queue.
#
# All ten verified against the live site 2026-09-04: each returns
# /seoLanding/roleSearch with "role" present in the GraphQL args.

roles:
  - software-engineer                 # 4964 claimed
  - artificial-intelligence-engineer  # 14124
  - machine-learning-engineer         # 825
  - product-manager                   # 4435
  - backend-engineer                  # 2495
  - mobile-engineer                   # 832
  - frontend-engineer                 # 1302
  - full-stack-engineer               # 2014
  - software-architect                # 995
  - devops-engineer                   # 822

# "anywhere" -> /role/{slug}, no location filter at all.
# Location filtering happens locally in the UI against the real locationNames
# values, so there is no reason to make Wellfound narrow it for us.
# "remote" and named places still work; see src/fetch.py::search_url.
locations:
  - anywhere

# Safety stop. Real exhaustion is detected via page-wrap, not this number.
max_pages_per_slice: 20

# Seconds between requests to Wellfound. Concurrency is always 1.
delay_range: [3.0, 5.0]

user_agent: "jobsearch-personal/0.1 (+nagmudit@users.noreply.github.com)"

yield_floor: 1

# Age cutoff, in days. Jobs older than this are NOT ingested, NOT enriched, and
# NOT shown. Set to 0 (or null) to disable and keep everything.
#
# This cannot make the crawl cheaper: Wellfound does not order results by date
# (page 20 of a slice still contains 3-day-old jobs), so every page must still
# be fetched. The saving is corpus quality, not requests.
#
# Raising it later does not require a re-crawl -- the raw pages stay in cache/.
# Re-ingest with:  python -m src.cli crawl --no-resume --max-age-days 90
max_age_days: 30
