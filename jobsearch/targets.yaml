# Everything the crawler targets lives here. Nothing is hardcoded in the source.
# The UI crawls a subset of these on demand; this file is the menu, not a queue.
#
# All ten verified against the live site 2026-09-04: each returns
# /seoLanding/roleSearch with "role" present in the GraphQL args.

roles:
  - software-engineer                 # 4964 claimed
  - artificial-intelligence-engineer  # 14124
  - machine-learning-engineer         # 825
  - product-manager                   # 4435
  - backend-engineer                  # 2495
  - mobile-engineer                   # 832
  - frontend-engineer                 # 1302
  - full-stack-engineer               # 2014
  - software-architect                # 995
  - devops-engineer                   # 822

# "anywhere" -> /role/{slug}, no location filter at all.
# Location filtering happens locally in the UI against the real locationNames
# values, so there is no reason to make Wellfound narrow it for us.
# "remote" and named places still work; see src/fetch.py::search_url.
locations:
  - anywhere

# Safety stop. Real exhaustion is detected via page-wrap, not this number.
max_pages_per_slice: 20

# Seconds between requests to Wellfound. Concurrency is always 1.
delay_range: [3.0, 5.0]

user_agent: "jobsearch-personal/0.1 (+muditnag13@gmail.com)"

yield_floor: 1

# How stale a cached LISTING (search page, API feed, ATS board) may be before it
# is re-fetched. Without this the disk cache never expired, so a second
# `fetch --roles X` replayed pages from days earlier and could not see a single
# job posted since -- the tool was live exactly once per URL.
#
# Detail pages are NOT aged out (a job description does not change), and a cached
# 403/429/cf-mitigated NEVER expires however old it is: aging one out would be a
# retry-through-mitigation on a timer. Set to 0 for the old permanent cache.
# See ADR-011.
cache_ttl_hours: 6

# Age cutoff, in days. Jobs older than this are NOT ingested, NOT enriched, and
# NOT shown. Set to 0 (or null) to disable and keep everything.
#
# This cannot make the crawl cheaper: Wellfound does not order results by date
# (page 20 of a slice still contains 3-day-old jobs), so every page must still
# be fetched. The saving is corpus quality, not requests.
#
# Raising it later does not require a re-crawl -- the raw pages stay in cache/.
# Re-ingest with:  python -m src.cli crawl --no-resume --max-age-days 90
max_age_days: 30

# Other platforms. Each has its own shape; see src/sources/.
# Wellfound uses the roles x locations above and is always enabled.
sources:
  remoteok:
    enabled: true
    # Optional tag filter. {} means the default endpoint (latest ~100).
    # RemoteOK has no pagination, so one request is the whole result.
    targets:
      - {}
      - {tag: dev}
      - {tag: engineer}

  himalayas:
    enabled: true
    # limit is server-capped at 20, so max_pages 250 ~= 5,000 jobs ~= 17 min on a
    # cold cache, then free within cache_ttl_hours. totalCount was 101,235 on
    # 2026-09-04, so this reaches the newest ~5% -- which is where fresh jobs are.
    # Himalayas has NO server-side filter of any kind, so depth is pure request
    # cost and every job must be fetched to be judged. See ADR-009.
    max_pages: 250
    targets:
      - {name: all, offset: 0}

  # ATS boards. These cannot be searched by role at all -- they EXPAND companies
  # the role already touched, bounded by the corpus (ADR-010). They were absent
  # from this block, which made `source_enabled` fall through to its
  # "wellfound only" default and silently left them out of every role fetch.
  #
  # Cost is real and unbounded by design: one cold role fetch across all sources
  # runs ~1,100 requests / 75-95 min at the mandated 3-5 s, Ashby dominating
  # because it needs a detail fetch per posting. Run it in the background.
  greenhouse:
    enabled: true
  ashby:
    enabled: true
  workable:
    enabled: true
  lever:
    enabled: true

# Per-role translation to each source's query shape. The `roles:` list above is
# the canonical vocabulary; this maps it outward.
#
# Only Wellfound filters by role server-side. RemoteOK's ?tag= shifts the result
# set but is mostly NOT role-relevant (measured title-relevance 2026-09-04 in
# brackets), and Himalayas ignores every filter parameter outright -- so for both
# of those the `keywords` below are applied LOCALLY after fetching.
# `remoteok: null` means no tag returned jobs at all; verified, not assumed.
role_map:
  software-engineer:
    remoteok: software          # 30 jobs, 83% title-relevant -- the best tag on the site
    keywords: [software engineer, developer, engineer, swe]
    categories: [Software-Engineer, Software-Engineering]

  artificial-intelligence-engineer:
    remoteok: ai                # 75 jobs, 11% relevant -- local filter does the real work
    keywords: [ai, artificial intelligence, machine learning, ml, llm, genai,
               deep learning, data scientist]
    categories: [Artificial-Intelligence, Machine-Learning, Data-Science]

  machine-learning-engineer:
    remoteok: machine learning  # 20 jobs, 60% relevant. NOTE: "machine-learning"
                                # and "ml" both return junk -- the space matters
    keywords: [machine learning, ml, mlops, deep learning, ai]
    categories: [Machine-Learning, Data-Science]

  product-manager:
    remoteok: product-manager   # 100 jobs, 14% relevant
    keywords: [product manager, product owner, product management]
    categories: [Product-Management]

  backend-engineer:
    remoteok: backend           # 100 jobs, 9% relevant
    keywords: [backend, back end, api engineer, server]
    categories: [Backend-Engineering, Software-Engineer]

  mobile-engineer:
    remoteok: mobile            # 100 jobs, 1% relevant
    keywords: [mobile, ios, android, react native, flutter]
    categories: [Mobile-Development]

  frontend-engineer:
    remoteok: front end         # 100 jobs, 13%. NOTE: "frontend" returns 0 --
                                # the space matters here too
    keywords: [frontend, front end, react, ui engineer, web developer]
    categories: [Frontend-Engineering, Software-Engineer]

  full-stack-engineer:
    remoteok: full stack        # 99 jobs, 4%. "fullstack" returns 0
    keywords: [full stack, fullstack, full-stack]
    categories: [Software-Engineer]

  software-architect:
    remoteok: architect         # 100 jobs, 3% relevant
    keywords: [architect, principal engineer, staff engineer]
    categories: [Software-Engineer]

  devops-engineer:
    remoteok: devops            # 100 jobs, 3% relevant
    keywords: [devops, sre, site reliability, platform engineer, infrastructure]
    categories: [DevOps, Infrastructure]
